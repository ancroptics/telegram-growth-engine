services:
  - type: web
    name: telegram-growth-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    branch: main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPERADMIN_IDS
        sync: false
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: "INFO"
