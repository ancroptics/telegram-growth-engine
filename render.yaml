services:
  - type: worker
    name: telegram-growth-engine
    runtime: python
    repo: https://github.com/ancroptics/telegram-growth-engine
    branch: main
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
